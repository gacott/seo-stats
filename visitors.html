<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Stats - SEO Stats 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f8fafc;
            padding: 2rem 1rem;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #0f172a;
        }
        
        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }
        
        .stat-number {
            font-size: 3rem;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: #64748b;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }
        
        .section h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #0f172a;
        }
        
        .visitor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .visitor-item:last-child {
            border-bottom: none;
        }
        
        .visitor-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .visitor-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        
        .bot-icon {
            background: #dbeafe;
        }
        
        .human-icon {
            background: #d1fae5;
        }
        
        .visitor-name {
            font-weight: 600;
            color: #0f172a;
        }
        
        .visitor-type {
            font-size: 0.85rem;
            color: #64748b;
        }
        
        .visitor-time {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #64748b;
        }
        
        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
            color: #64748b;
        }
        
        a {
            color: #2563eb;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Visitor Statistics</h1>
            <p class="subtitle">Live tracking of bots and humans visiting SEO Stats 2026</p>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="total-visits">0</div>
                <div class="stat-label">Total Visits</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="bot-visits">0</div>
                <div class="stat-label">Bot Visits</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="human-visits">0</div>
                <div class="stat-label">Human Visits</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="last-update">--</div>
                <div class="stat-label">Last Update</div>
            </div>
        </div>
        
        <div class="section">
            <h2>Recent Activity</h2>
            <div id="visitor-list">
                <div class="loading">Loading visitor data...</div>
            </div>
        </div>
        
        <div class="section">
            <h2>Bot Breakdown</h2>
            <div id="bot-breakdown">
                <div class="loading">Loading bot data...</div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>Powered by Pageview.dev | <a href="index.html">Back to SEO Stats</a></p>
    </footer>
    
    <script>
        // Track this visit
        const userAgent = navigator.userAgent.toLowerCase();
        const isBot = /bot|crawl|spider|slurp|bingbot|yandex|baidu|facebook|twitter|google/i.test(userAgent);
        
        // Get or initialize visits array from localStorage
        let visits = JSON.parse(localStorage.getItem('seo-stats-visits') || '[]');
        
        // Add current visit
        visits.push({
            timestamp: new Date().toISOString(),
            userAgent: userAgent.substring(0, 200),
            isBot: isBot
        });
        
        // Keep only last 100 visits
        if (visits.length > 100) {
            visits = visits.slice(-100);
        }
        
        // Save to localStorage
        localStorage.setItem('seo-stats-visits', JSON.stringify(visits));
        
        // Update stats
        const bots = visits.filter(v => v.isBot);
        const humans = visits.filter(v => !v.isBot);
        
        document.getElementById('total-visits').textContent = visits.length;
        document.getElementById('bot-visits').textContent = bots.length;
        document.getElementById('human-visits').textContent = humans.length;
        document.getElementById('last-update').textContent = 'Live';
        
        // Render recent activity
        const visitorList = document.getElementById('visitor-list');
        if (visits.length === 0) {
            visitorList.innerHTML = '<p class="loading">No visits recorded yet. Check back soon!</p>';
        } else {
            visitorList.innerHTML = visits.slice(-20).reverse().map(visit => {
                const timeAgo = getTimeAgo(visit.timestamp);
                const icon = visit.isBot ? '🤖' : '👤';
                const iconClass = visit.isBot ? 'bot-icon' : 'human-icon';
                const type = visit.isBot ? 'Bot' : 'Human';
                
                return `
                    <div class="visitor-item">
                        <div class="visitor-info">
                            <div class="visitor-icon ${iconClass}">${icon}</div>
                            <div>
                                <div class="visitor-name">${visit.userAgent || 'Unknown'}</div>
                                <div class="visitor-type">${type}</div>
                            </div>
                        </div>
                        <div class="visitor-time">${timeAgo}</div>
                    </div>
                `;
            }).join('');
        }
        
        // Render bot breakdown
        const botBreakdown = document.getElementById('bot-breakdown');
        if (bots.length === 0) {
            botBreakdown.innerHTML = '<p class="loading">No bot visits recorded yet.</p>';
        } else {
            const botNames = {};
            bots.forEach(bot => {
                const name = bot.userAgent || 'Unknown Bot';
                botNames[name] = (botNames[name] || 0) + 1;
            });
            
            botBreakdown.innerHTML = Object.entries(botNames)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10)
                .map(([name, count]) => `
                    <div class="visitor-item">
                        <div class="visitor-info">
                            <div class="visitor-icon bot-icon">🤖</div>
                            <div>
                                <div class="visitor-name">${name}</div>
                                <div class="visitor-type">Bot</div>
                            </div>
                        </div>
                        <div class="visitor-time">${count} visit${count !== 1 ? 's' : ''}</div>
                    </div>
                `).join('');
        }
        
        function getTimeAgo(timestamp) {
            const now = new Date();
            const then = new Date(timestamp);
            const diffMs = now - then;
            const diffMins = Math.floor(diffMs / 60000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffMins < 1440) return `${Math.floor(diffMins / 60)}h ago`;
            return `${Math.floor(diffMins / 1440)}d ago`;
        }
    </script>
</body>
</html>
